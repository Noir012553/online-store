name: Translation key checks

on:
  pull_request:
  push:

jobs:
  verify-translations:
    name: Verify translations and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            online-store-backend/package-lock.json
            online-store-frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: online-store-backend
        run: npm ci
      - name: Check language inventory
        working-directory: online-store-backend
        run: npm run check:language-inventory
      - name: Check translation key consistency
        working-directory: online-store-backend
        run: npm run check:translation-consistency
      - name: Audit English fallback values
        working-directory: online-store-backend
        run: npm run check:translation-fallback
      - name: Check frontend translation keys
        working-directory: online-store-backend
        run: npm run check:translation-keys
      - name: Install frontend dependencies
        working-directory: online-store-frontend
        run: npm ci
      - name: Build frontend
        working-directory: online-store-frontend
        run: npm run build
