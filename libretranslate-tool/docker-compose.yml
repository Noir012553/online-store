services:
  redis:
    image: redis:7-alpine
    container_name: laptop-store-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: libretranslate-product-tool
    user: "0:0"
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5000"
    command:
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --load-only
      - vi,en,pt,fr,de,it,es,nl,sv
      - --update-models
      - --threads
      - "1"
    volumes:
      - libretranslate_models:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/languages', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  libretranslate_models:
