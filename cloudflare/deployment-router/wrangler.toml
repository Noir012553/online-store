name = "online-store-deployment-router"
main = "worker.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
NODE_ENV = "production"
DEPLOYMENT_INITIAL_MODE = "tunnel"
DEPLOYMENT_PUBLIC_FRONTEND_HOST = "manln.online"
DEPLOYMENT_PUBLIC_BACKEND_HOST = "backend.manln.online"
DEPLOYMENT_RUNNER_ID = "laptop-store-windows-01"
TUNNEL_BACKEND_HEALTH_PATH = "/readyz"
RENDER_BACKEND_HEALTH_PATH = "/readyz"

[[durable_objects.bindings]]
name = "DEPLOYMENT_STATE"
class_name = "DeploymentState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeploymentState"]
